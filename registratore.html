<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registratore</title>
<style>
  /* colori neutri a meta tono: restano leggibili su sfondo chiaro e scuro, sfondo trasparente */
  :root { --fg:#6b6b67; --muted:#8c8b87; --line:rgba(128,128,128,.35); --soft:rgba(128,128,128,.12);
          --accent:#e5484d; --ok:#2e9d57; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { background:transparent; }
  body { margin:0; padding:12px; color:var(--fg);
         font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; }

  .panel { display:flex; align-items:center; gap:8px; }

  button { font:inherit; color:var(--fg); cursor:pointer; background:var(--soft);
           border:1px solid var(--line); border-radius:8px; }
  button:hover:not(:disabled) { background:rgba(128,128,128,.22); }
  button:disabled { opacity:.35; cursor:default; }
  button svg { display:block; margin:auto; fill:currentColor; }

  .ctl { width:44px; height:34px; padding:0; }
  .ctl svg { width:14px; height:14px; }
  #play.live { color:var(--accent); opacity:1; }
  #play.live svg { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }

  #time { font-variant-numeric: tabular-nums; font-size:18px; min-width:56px; margin-left:4px; }
  #meter { flex:1; min-width:24px; height:5px; background:var(--soft); border-radius:3px; overflow:hidden; }
  #bar { height:100%; width:0; background:var(--accent); transition:width .08s; }

  #gear { position:relative; width:30px; height:30px; padding:0; border:none; background:transparent; border-radius:50%; }
  #gear:hover:not(:disabled) { background:var(--soft); }
  #gear svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #gear .dot { position:absolute; top:3px; right:3px; width:7px; height:7px; border-radius:50%; background:var(--ok); }

  #proj, .field input[type=text], .field input[type=password] {
    font:inherit; font-size:14px; color:var(--fg); background:transparent;
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  #proj { width:100%; margin-top:10px; }
  #proj::placeholder, .field input::placeholder { color:var(--muted); opacity:.7; }

  #settings { margin-top:10px; border:1px solid var(--line); border-radius:10px; padding:4px 14px 14px; }
  .field { display:flex; flex-direction:column; gap:3px; margin-top:10px; font-size:12px; color:var(--muted); }
  .field input { padding:6px 8px !important; }
  .check { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; }
  .hint { font-size:12px; color:var(--muted); margin:10px 0 0; line-height:1.45; }
  .tbtn { padding:6px 12px; font-size:13px; }

  #msg { color:var(--muted); font-size:13px; margin:10px 2px; min-height:18px; }

  ul { list-style:none; padding:0; margin:12px 0 0; }
  li { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; }
  li .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;
            font-size:13px; color:var(--muted); gap:8px; }
  li .row span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  li audio { width:100%; }
  .actions { display:flex; gap:6px; flex-shrink:0; }
  .ibtn { width:32px; height:28px; padding:0; }
  .ibtn svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ibtn.done { color:var(--ok); opacity:1; }
  .st { font-size:12px; color:var(--muted); margin-top:6px; word-break:break-all; }
  .st.ok { color:var(--ok); } .st.err { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <button id="play" class="ctl" title="Registra" aria-label="Registra">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
    </button>
    <button id="pause" class="ctl" title="Pausa" aria-label="Pausa" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4.2" height="16" rx="1"/><rect x="13.8" y="4" width="4.2" height="16" rx="1"/></svg>
    </button>
    <button id="stop" class="ctl" title="Stop" aria-label="Stop" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>
    </button>
    <span id="time">00:00</span>
    <div id="meter"><div id="bar"></div></div>
    <button id="gear" title="Impostazioni" aria-label="Impostazioni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="dot" id="dot" hidden></span>
    </button>
  </div>

  <input id="proj" type="text" autocomplete="off" placeholder="Nome progetto (facoltativo)" maxlength="60">

  <div id="settings" hidden>
    <label class="field">Token GitHub
      <input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_...">
    </label>
    <label class="field">Utente GitHub
      <input id="ghOwner" type="text" autocomplete="off" placeholder="tuo-username">
    </label>
    <label class="field">Repository (privato)
      <input id="ghRepo" type="text" autocomplete="off" placeholder="registrazioni">
    </label>
    <label class="field">Cartella (facoltativa)
      <input id="ghDir" type="text" autocomplete="off" placeholder="audio">
    </label>
    <label class="check"><input id="ghAuto" type="checkbox"> Salva su GitHub appena finisco di registrare</label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">
      <button id="ghSaveCfg" class="tbtn">Salva</button>
      <button id="ghTest" class="tbtn">Verifica</button>
      <button id="ghClear" class="tbtn">Cancella token</button>
    </div>
    <div class="st" id="cfgSt"></div>
    <p class="hint">Il token resta solo in questo browser e viene inviato soltanto a GitHub. Usa un token limitato a un solo repository privato.</p>
  </div>

  <div id="msg"></div>
  <ul id="list"></ul>
</div>

<script>
const $ = id => document.getElementById(id);
const playBtn = $('play'), pauseBtn = $('pause'), stopBtn = $('stop'),
      timeEl = $('time'), bar = $('bar'), msg = $('msg'), list = $('list');

let stream, recorder, chunks = [], startTs = 0, elapsed = 0, timer, audioCtx, analyser, raf, starting = false;

const ICON = {
  download: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  trash:    '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  upload:   '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>',
  check:    '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>'
};

function pickMime() {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  return types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');
function tick() { timeEl.textContent = fmt(elapsed + (Date.now() - startTs)/1000); }

// stato dei tre pulsanti: 'idle' | 'rec' | 'paused'
function setUI(state) {
  playBtn.disabled  = (state === 'rec');
  pauseBtn.disabled = (state !== 'rec');
  stopBtn.disabled  = (state === 'idle');
  playBtn.classList.toggle('live', state === 'rec');
  playBtn.title = playBtn.ariaLabel = (state === 'paused') ? 'Riprendi' : 'Registra';
}

function startMeter() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);
  const loop = () => {
    analyser.getByteTimeDomainData(data);
    let peak = 0;
    for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
    bar.style.width = Math.min(100, peak / 128 * 140) + '%';
    raf = requestAnimationFrame(loop);
  };
  loop();
}
function stopMeter() {
  cancelAnimationFrame(raf); bar.style.width = '0';
  if (audioCtx) audioCtx.close();
}

async function start() {
  if (starting) return;
  starting = true; msg.textContent = '';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    msg.textContent = 'Microfono non disponibile: ' + (e.name === 'NotAllowedError'
      ? 'permesso negato. Se sei dentro Notion, apri la pagina in una scheda a parte.' : e.message);
    starting = false; return;
  }
  starting = false;
  const mime = pickMime();
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = save;
  recorder.start();
  startMeter();
  elapsed = 0; startTs = Date.now();
  timer = setInterval(tick, 250);
  setUI('rec');
}

function pauseRec() {
  if (!recorder || recorder.state !== 'recording') return;
  elapsed += (Date.now() - startTs) / 1000;
  recorder.pause(); clearInterval(timer);
  setUI('paused');
}
function resumeRec() {
  startTs = Date.now(); recorder.resume();
  timer = setInterval(tick, 250);
  setUI('rec');
}
function stopRec() {
  if (!recorder || recorder.state === 'inactive') return;
  if (recorder.state === 'recording') elapsed += (Date.now() - startTs) / 1000;
  recorder.stop();
  stream.getTracks().forEach(t => t.stop());
  clearInterval(timer); stopMeter();
  setUI('idle');
}

playBtn.onclick = () => (recorder && recorder.state === 'paused') ? resumeRec() : start();
pauseBtn.onclick = pauseRec;
stopBtn.onclick = stopRec;
setUI('idle');

/* ---------- Impostazioni GitHub ---------- */
const CFG_KEY = 'rec-gh-cfg';
const cfgIds = { token:'ghToken', owner:'ghOwner', repo:'ghRepo', dir:'ghDir' };
const cfgSt = $('cfgSt');
let memCfg = null; // copia in memoria, vale anche se il browser blocca localStorage

function loadCfg() {
  try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (e) { return {}; }
}
function getCfg() { return memCfg || loadCfg(); }
function readForm() {
  const c = {};
  for (const k in cfgIds) c[k] = $(cfgIds[k]).value.trim();
  c.dir = c.dir.replace(/^\/+|\/+$/g, '');
  c.auto = $('ghAuto').checked;
  return c;
}
function fillForm(c) {
  for (const k in cfgIds) $(cfgIds[k]).value = c[k] || '';
  $('ghAuto').checked = !!c.auto;
}
function updateDot() {
  const c = getCfg();
  $('dot').hidden = !(c.token && c.owner && c.repo);
}
function setCfgSt(text, cls) { cfgSt.textContent = text; cfgSt.className = 'st' + (cls ? ' ' + cls : ''); }

$('gear').onclick = () => { $('settings').hidden = !$('settings').hidden; };

$('ghSaveCfg').onclick = () => {
  const c = readForm(); memCfg = c;
  try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); setCfgSt('Impostazioni salvate in questo browser.', 'ok'); }
  catch (e) { setCfgSt('Il browser blocca il salvataggio locale: le impostazioni valgono finche questa pagina resta aperta.', 'err'); }
  updateDot();
};
$('ghClear').onclick = () => {
  $('ghToken').value = '';
  const c = readForm(); memCfg = c;
  try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {}
  updateDot(); setCfgSt('Token cancellato.');
};
$('ghTest').onclick = async () => {
  const c = readForm(); memCfg = c; updateDot();
  if (!c.token || !c.owner || !c.repo) { setCfgSt('Compila token, utente e repository.', 'err'); return; }
  setCfgSt('Verifico...');
  try {
    const r = await fetch('https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo), {
      headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
    });
    if (r.status === 401) return setCfgSt('Token non valido o scaduto.', 'err');
    if (r.status === 404) return setCfgSt('Repository non trovato: controlla utente e nome, e che il token abbia accesso a quel repository.', 'err');
    if (!r.ok) return setCfgSt('Errore GitHub ' + r.status + '.', 'err');
    const d = await r.json();
    if (d.permissions && d.permissions.push === false) return setCfgSt('Connesso, ma il token non puo scrivere: serve il permesso Contents: Read and write.', 'err');
    setCfgSt('Tutto ok: ' + d.full_name + (d.private ? ' (privato)' : ' (ATTENZIONE: il repository e pubblico)') + '.', d.private ? 'ok' : 'err');
  } catch (e) {
    setCfgSt('Errore di rete: controlla la connessione.', 'err');
  }
};
fillForm(loadCfg()); updateDot();

/* ---------- Upload ---------- */
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}

async function uploadToGitHub(blob, filename, sub) {
  const c = getCfg();
  if (!c.token || !c.owner || !c.repo) throw new Error('Apri la rotellina e compila token, utente e repository.');
  const dir = (c.dir || '').replace(/^\/+|\/+$/g, '');
  const path = [dir, sub, filename].filter(Boolean).join('/');
  const url = 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) +
              '/contents/' + path.split('/').map(encodeURIComponent).join('/');
  const content = await blobToBase64(blob);
  const resp = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': 'Bearer ' + c.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ message: 'Aggiunta registrazione ' + filename, content })
  });
  if (!resp.ok) {
    let detail = '';
    try { detail = (await resp.json()).message || ''; } catch (e) {}
    if (resp.status === 401) throw new Error('Token non valido o scaduto.');
    if (resp.status === 403) throw new Error('Permesso negato: il token deve avere Contents: Read and write su questo repository. ' + detail);
    if (resp.status === 404) throw new Error('Repository non trovato, oppure il token non ci ha accesso.');
    if (resp.status === 409 || resp.status === 422) throw new Error('Richiesta rifiutata (esiste gia un file con questo nome?). ' + detail);
    throw new Error('Errore GitHub ' + resp.status + '. ' + detail);
  }
  const data = await resp.json();
  return data.content && data.content.html_url ? data.content.html_url : '';
}

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + '_' +
         p(d.getHours()) + '-' + p(d.getMinutes()) + '-' + p(d.getSeconds());
}

// nome progetto -> solo lettere, numeri, trattini (niente accenti o spazi), adatto a file e cartelle
function cleanName(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '')
          .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
const PROJ_KEY = 'rec-project';
try { $('proj').value = localStorage.getItem(PROJ_KEY) || ''; } catch (e) {}
$('proj').addEventListener('input', () => { try { localStorage.setItem(PROJ_KEY, $('proj').value); } catch (e) {} });

function iconBtn(icon, title) {
  const b = document.createElement('button');
  b.className = 'ibtn'; b.title = title; b.setAttribute('aria-label', title); b.innerHTML = icon;
  return b;
}

function save() {
  const type = recorder.mimeType || 'audio/webm';
  const blob = new Blob(chunks, { type });
  const url = URL.createObjectURL(blob);
  const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
  const proj = cleanName($('proj').value);
  const name = (proj || 'registrazione') + '_' + stamp() + '.' + ext;
  const li = document.createElement('li');
  li.innerHTML = '<div class="row"><span></span><div class="actions"></div></div><audio controls></audio><div class="st"></div>';
  const st = li.querySelector('.st');
  li.querySelector('span').textContent = name + ' · ' + fmt(elapsed);
  li.querySelector('audio').src = url;

  const a = document.createElement('a'); a.href = url; a.download = name;
  const dl = iconBtn(ICON.download, 'Scarica');
  dl.onclick = () => a.click();
  const del = iconBtn(ICON.trash, 'Elimina');
  del.onclick = () => { URL.revokeObjectURL(url); li.remove(); };
  const gh = iconBtn(ICON.upload, 'Salva su GitHub');
  const doUpload = async () => {
    gh.disabled = true; st.className = 'st'; st.textContent = 'Caricamento su GitHub...';
    try {
      const link = await uploadToGitHub(blob, name, proj);
      st.className = 'st ok'; st.textContent = 'Salvata su GitHub' + (link ? ': ' + link : '.');
      gh.innerHTML = ICON.check; gh.classList.add('done'); gh.title = 'Salvata';
    } catch (e) {
      st.className = 'st err'; st.textContent = (e && e.message) || 'Errore di rete: controlla la connessione.';
      gh.disabled = false;
    }
  };
  gh.onclick = doUpload;
  li.querySelector('.actions').append(gh, dl, del);
  list.prepend(li);
  timeEl.textContent = '00:00';
  msg.textContent = 'Le registrazioni restano solo in questa pagina finche non le salvi o scarichi.';
  const c = getCfg();
  if (c.auto && c.token && c.owner && c.repo) doUpload();
}

if (!navigator.mediaDevices || !window.MediaRecorder) {
  playBtn.disabled = true;
  msg.textContent = 'Questo browser non supporta la registrazione audio.';
}
</script>
</body>
</html>
