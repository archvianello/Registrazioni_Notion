<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registratore</title>
<style>
  :root { --bg:#fff; --fg:#37352f; --muted:#9b9a97; --line:#e9e9e7; --accent:#eb5757; --card:#f7f6f3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#191919; --fg:#ebebea; --muted:#8a8a87; --line:#2f2f2f; --card:#252525; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .panel { display:flex; align-items:center; gap:12px; background:var(--card);
           border:1px solid var(--line); border-radius:10px; padding:14px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--bg);
           color:var(--fg); border-radius:8px; padding:8px 14px; }
  button:hover { background:var(--card); }
  button:disabled { opacity:.4; cursor:default; }
  #rec { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  #rec.on { background:var(--fg); border-color:var(--fg); color:var(--bg); }
  #time { font-variant-numeric: tabular-nums; font-size:20px; min-width:64px; }
  #meter { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  #bar { height:100%; width:0; background:var(--accent); transition:width .08s; }
  #msg { color:var(--muted); font-size:13px; margin:10px 2px; min-height:18px; }
  ul { list-style:none; padding:0; margin:12px 0 0; }
  li { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; }
  li .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;
            font-size:13px; color:var(--muted); gap:8px; }
  li audio { width:100%; }
  .actions { display:flex; gap:6px; }
  .actions button { padding:4px 10px; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <button id="rec">● Registra</button>
    <button id="pause" disabled>Pausa</button>
    <span id="time">00:00</span>
    <div id="meter"><div id="bar"></div></div>
  </div>
  <div id="msg"></div>
  <ul id="list"></ul>
</div>

<script>
const $ = id => document.getElementById(id);
const recBtn = $('rec'), pauseBtn = $('pause'), timeEl = $('time'), bar = $('bar'), msg = $('msg'), list = $('list');

let stream, recorder, chunks = [], startTs = 0, elapsed = 0, timer, audioCtx, analyser, raf;

function pickMime() {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  return types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');

function tick() { timeEl.textContent = fmt(elapsed + (Date.now() - startTs)/1000); }

function startMeter() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);
  const loop = () => {
    analyser.getByteTimeDomainData(data);
    let peak = 0;
    for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
    bar.style.width = Math.min(100, peak / 128 * 140) + '%';
    raf = requestAnimationFrame(loop);
  };
  loop();
}
function stopMeter() {
  cancelAnimationFrame(raf); bar.style.width = '0';
  if (audioCtx) audioCtx.close();
}

async function start() {
  msg.textContent = '';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    msg.textContent = 'Microfono non disponibile: ' + (e.name === 'NotAllowedError'
      ? 'permesso negato. Se sei dentro Notion, prova ad aprire la pagina in una scheda a parte.' : e.message);
    return;
  }
  const mime = pickMime();
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = save;
  recorder.start();
  startMeter();
  elapsed = 0; startTs = Date.now();
  timer = setInterval(tick, 250);
  recBtn.textContent = '■ Stop'; recBtn.classList.add('on');
  pauseBtn.disabled = false; pauseBtn.textContent = 'Pausa';
}

function stop() {
  if (recorder.state === 'paused') startTs = Date.now();
  else elapsed += (Date.now() - startTs) / 1000;
  recorder.stop();
  stream.getTracks().forEach(t => t.stop());
  clearInterval(timer); stopMeter();
  recBtn.textContent = '● Registra'; recBtn.classList.remove('on');
  pauseBtn.disabled = true;
}

function togglePause() {
  if (recorder.state === 'recording') {
    elapsed += (Date.now() - startTs) / 1000;
    recorder.pause(); clearInterval(timer);
    pauseBtn.textContent = 'Riprendi';
  } else if (recorder.state === 'paused') {
    startTs = Date.now(); recorder.resume();
    timer = setInterval(tick, 250);
    pauseBtn.textContent = 'Pausa';
  }
}

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + '_' +
         p(d.getHours()) + '-' + p(d.getMinutes()) + '-' + p(d.getSeconds());
}

function save() {
  const type = recorder.mimeType || 'audio/webm';
  const blob = new Blob(chunks, { type });
  const url = URL.createObjectURL(blob);
  const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
  const name = 'registrazione_' + stamp() + '.' + ext;
  const li = document.createElement('li');
  li.innerHTML = '<div class="row"><span></span><div class="actions"></div></div><audio controls></audio>';
  li.querySelector('span').textContent = name + ' · ' + fmt(elapsed);
  li.querySelector('audio').src = url;
  const a = document.createElement('a'); a.href = url; a.download = name;
  const dl = document.createElement('button'); dl.textContent = 'Scarica';
  dl.onclick = () => a.click();
  const del = document.createElement('button'); del.textContent = 'Elimina';
  del.onclick = () => { URL.revokeObjectURL(url); li.remove(); };
  li.querySelector('.actions').append(dl, del);
  list.prepend(li);
  timeEl.textContent = '00:00';
  msg.textContent = 'Premi Scarica, poi trascina il file nella tua pagina Notion. Le registrazioni non vengono salvate qui.';
}

recBtn.onclick = () => (recorder && recorder.state !== 'inactive') ? stop() : start();
pauseBtn.onclick = togglePause;

if (!navigator.mediaDevices || !window.MediaRecorder) {
  recBtn.disabled = true;
  msg.textContent = 'Questo browser non supporta la registrazione audio.';
}
</script>
</body>
</html>
